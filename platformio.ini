; PlatformIO project for the Nob rotary encoder (Seeed XIAO ESP32-C3)
; Docs: https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
	igorantolic/Ai Esp32 Rotary Encoder@^1.7
	mathertel/OneButton@^2.6.1
	; Pinned to 1.3.x: later versions need ESP32 core 3.x (esp32-hal-periman.h),
	; but this platform ships core 2.0.17. Bump this if you move to core 3.x.
	moononournation/GFX Library for Arduino@~1.3.1

build_flags =
	-Os
	; XIAO ESP32-C3 talks to the USB-C port over USB Serial/JTAG.
	; This routes Serial (Serial.print) out the USB-C port so the monitor sees it:
	-D ARDUINO_USB_CDC_ON_BOOT=1

	; Display: Arduino_GFX (GC9A01) is configured entirely in code in
	; src/main.cpp (bus + driver + pins), so no display build_flags are needed.

; Build artifacts default to .pio/ inside this OneDrive-synced repo. If OneDrive
; ever locks a file mid-build, point the build elsewhere on a short local path:
; build_dir = C:/pio_build/nob
